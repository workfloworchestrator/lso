---
- name: Test Ansible functionality
  # `all`, not a hardcoded host: the play must target whatever the submitted inventory provides, so that a test
  # run proves the inventory sent through the API is the one Ansible executed against.
  hosts: all
  connection: local
  gather_facts: false

  tasks:
    - name: Print the inventory hostname
      ansible.builtin.debug:
        msg: "ran against {{ inventory_hostname }}"
